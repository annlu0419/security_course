<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SQL 互動教材｜SELECT 進階（LIKE / BETWEEN / IN / IS NULL / GROUP BY / HAVING）</title>
  <style>
    :root{
      --bg:#0b1220; --card:#121b2f; --card2:#0f172a;
      --text:#e5e7eb; --muted:#a7b0c0;
      --accent:#60a5fa; --accent2:#34d399; --warn:#fbbf24; --danger:#fb7185;
      --line:rgba(255,255,255,.08);
      --shadow: 0 10px 25px rgba(0,0,0,.35);
      --radius:16px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans TC", Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, rgba(96,165,250,.15), transparent 60%),
                  radial-gradient(1000px 500px at 80% 0%, rgba(52,211,153,.12), transparent 55%),
                  var(--bg);
      color:var(--text);
    }
    header{
      max-width: 1140px;
      margin: 28px auto 10px;
      padding: 0 18px;
      display:flex;
      gap:16px;
      align-items:flex-start;
      justify-content:space-between;
      flex-wrap:wrap;
    }
    .brand{display:flex; gap:12px; align-items:center;}
    .logo{
      width:44px; height:44px; border-radius:14px;
      background: linear-gradient(135deg, rgba(96,165,250,.9), rgba(52,211,153,.85));
      box-shadow: var(--shadow);
    }
    h1{margin:0; font-size: 18px; line-height: 1.2;}
    .subtitle{margin:4px 0 0; color: var(--muted); font-size: 13px; line-height:1.4;}
    .top-actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
    button, .pill{
      border:1px solid var(--line);
      background: rgba(255,255,255,.04);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      cursor:pointer;
      font-weight: 700;
      transition: .15s ease;
    }
    button:hover{transform: translateY(-1px); background: rgba(255,255,255,.06);}
    button:disabled{opacity:.45; cursor:not-allowed; transform:none;}
    .pill{cursor: default; font-size: 12px; color: var(--muted); font-weight: 700;}
    main{
      max-width: 1140px;
      margin: 0 auto 40px;
      padding: 0 18px;
      display:grid;
      grid-template-columns: 380px 1fr;
      gap: 16px;
    }
    @media (max-width: 980px){ main{grid-template-columns: 1fr} }
    .panel{
      background: rgba(18,27,47,.78);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .panel .hd{
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display:flex; align-items:center; justify-content:space-between; gap:10px;
    }
    .panel .hd strong{font-size: 14px}
    .panel .bd{padding: 14px 16px}
    .progress{
      height:10px; background: rgba(255,255,255,.06);
      border-radius: 999px; overflow:hidden;
      border:1px solid var(--line);
    }
    .bar{
      height:100%; width:0%;
      background: linear-gradient(90deg, rgba(96,165,250,.9), rgba(52,211,153,.85));
      transition: width .25s ease;
    }
    .list{display:flex; flex-direction:column; gap:10px;}
    .stepbtn{
      text-align:left; width:100%;
      display:flex; gap:10px; align-items:center; justify-content:space-between;
      padding: 12px 12px; border-radius: 14px;
    }
    .left{display:flex; gap:10px; align-items:flex-start;}
    .num{
      width:26px; height:26px; border-radius: 10px;
      display:grid; place-items:center;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.04);
      font-family: var(--mono);
      font-size: 12px; color: var(--muted);
      flex: 0 0 auto;
    }
    .label{display:flex; flex-direction:column; gap:3px;}
    .label .title{font-weight:850; font-size: 13px}
    .label .desc{color: var(--muted); font-size: 12px}
    .badge{
      font-size: 11px; padding: 6px 8px; border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: rgba(255,255,255,.03);
      white-space:nowrap;
    }
    .badge.ok{color: rgba(52,211,153,.9); border-color: rgba(52,211,153,.25); background: rgba(52,211,153,.08)}
    .badge.lock{color: rgba(251,191,36,.9); border-color: rgba(251,191,36,.25); background: rgba(251,191,36,.08)}
    .badge.now{color: rgba(96,165,250,.95); border-color: rgba(96,165,250,.25); background: rgba(96,165,250,.08)}
    .content{min-height: 700px;}
    .kicker{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom: 10px;}
    .kicker .tag{
      font-size: 12px; padding: 6px 10px; border-radius: 999px;
      background: rgba(96,165,250,.10); border: 1px solid rgba(96,165,250,.25);
      color: rgba(96,165,250,.95); font-weight: 850;
    }
    .kicker .tag.green{
      background: rgba(52,211,153,.10);
      border-color: rgba(52,211,153,.25);
      color: rgba(52,211,153,.95);
    }
    .note{margin: 0 0 12px; color: var(--muted); line-height: 1.7; font-size: 14px;}
    .grid2{display:grid; grid-template-columns: 1fr 1fr; gap: 12px;}
    @media (max-width: 980px){ .grid2{grid-template-columns: 1fr} }
    .box{
      background: rgba(15,23,42,.6);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow:hidden;
    }
    .box .bhd{
      padding: 10px 12px; border-bottom: 1px solid var(--line);
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      color: var(--muted); font-size: 12px; font-weight: 800;
    }
    .box .bbd{padding: 10px 12px}
    pre{
      margin:0; padding: 12px; border-radius: 12px;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.08);
      overflow:auto; font-family: var(--mono);
      font-size: 13px; line-height: 1.55;
    }
    .actions{display:flex; gap:10px; flex-wrap:wrap; margin-top: 10px;}
    .btn-accent{background: rgba(96,165,250,.14); border-color: rgba(96,165,250,.25);}
    .btn-green{background: rgba(52,211,153,.14); border-color: rgba(52,211,153,.25);}
    .btn-warn{background: rgba(251,191,36,.14); border-color: rgba(251,191,36,.25);}
    table{
      width:100%;
      border-collapse: collapse;
      overflow:hidden;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(0,0,0,.25);
    }
    th, td{
      padding: 9px 10px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      text-align:left;
      vertical-align: top;
    }
    th{color: var(--muted); font-size: 12px; font-weight: 850; background: rgba(255,255,255,.03);}
    tr:last-child td{border-bottom:none}
    .hint{
      padding: 10px 12px; border-radius: 14px;
      background: rgba(251,191,36,.10);
      border: 1px solid rgba(251,191,36,.22);
      color: #fde68a;
      font-size: 13px; line-height: 1.65;
      margin-top: 12px;
    }
    .okhint{
      padding: 10px 12px; border-radius: 14px;
      background: rgba(52,211,153,.10);
      border: 1px solid rgba(52,211,153,.22);
      color: #bbf7d0;
      font-size: 13px; line-height: 1.65;
      margin-top: 12px;
    }
    .editor{
      width:100%;
      min-height: 120px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.30);
      color: var(--text);
      padding: 10px 12px;
      font-family: var(--mono);
      font-size: 13px;
      outline:none;
      line-height:1.6;
      resize: vertical;
    }
    footer{
      max-width: 1140px;
      margin: 0 auto 40px;
      padding: 0 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }
    code{font-family: var(--mono)}
  </style>
</head>

<body>
<header>
  <div class="brand">
    <div class="logo"></div>
    <div>
      <h1>SQL 互動式教材（進階）</h1>
      <p class="subtitle">LIKE、BETWEEN、IN、IS NULL、GROUP BY、HAVING：一個概念一個概念往下教</p>
    </div>
  </div>
  <div class="top-actions">
    <span class="pill" id="statusPill">進度：0 / 6</span>
    <button id="btnReset" class="btn-warn">重置進度</button>
    <button id="btnNext" class="btn-accent" disabled>下一個概念</button>
  </div>
</header>

<main>
  <section class="panel">
    <div class="hd">
      <strong>進階導覽</strong>
      <div style="min-width:140px">
        <div class="progress"><div class="bar" id="progressBar"></div></div>
      </div>
    </div>
    <div class="bd">
      <div class="list" id="stepList"></div>
      <div class="hint" style="margin-top:14px">
        互動流程：<br/>
        1) 先看範例 → 按執行看結果<br/>
        2) 寫練習題 SQL → 執行<br/>
        3) 標記完成 → 解鎖下一章
      </div>
    </div>
  </section>

  <section class="panel content">
    <div class="hd">
      <strong id="contentTitle">請從左側第 1 章開始</strong>
      <span class="badge now" id="contentBadge">尚未開始</span>
    </div>
    <div class="bd" id="contentArea"></div>
  </section>
</main>

<footer>
  ✅ 教學建議：先用這頁互動「看懂語意」，再把 SQL 貼到 phpMyAdmin 的 SQL 頁籤「真實執行」。<br/>
  ✅ GROUP BY/HAVING 的概念：<b>WHERE 是分組前篩選</b>、<b>HAVING 是分組後篩選</b>。
</footer>

<script>
  // -----------------------
  // 模擬資料（加一些 NULL、更多商品/評論，讓進階語法有感）
  // -----------------------
  const data = {
    member: [
      { mem_id: 1, cname: "小華", cemail: "hua@test.com", phone: "0911111111", birthday: "1995-01-01" },
      { mem_id: 2, cname: "小美", cemail: "mei@test.com", phone: null,         birthday: "1996-02-02" }, // phone NULL
      { mem_id: 3, cname: "小強", cemail: "qiang@test.com", phone: "0933333333", birthday: null },        // birthday NULL
      { mem_id: 4, cname: "小芳", cemail: "fang@test.com", phone: "0944444444", birthday: "1998-04-04" },
      { mem_id: 5, cname: "小明", cemail: "ming@test.com", phone: null,         birthday: "1999-05-05" }  // phone NULL
    ],
    product: [
      { pro_id: 1, productName: "iPhone 15",       pcategory: "electronics", sku:"APL-001", price:30000, stock:50  },
      { pro_id: 2, productName: "Nike Shoes",      pcategory: "sports",      sku:"NK-002",  price:4500,  stock:100 },
      { pro_id: 3, productName: "T-shirt",         pcategory: "clothing",    sku:"CL-003",  price:800,   stock:200 },
      { pro_id: 4, productName: "Coffee Beans",    pcategory: "food",        sku:"FD-004",  price:200,   stock:500 },
      { pro_id: 5, productName: "Coffee Latte",    pcategory: "food",        sku:"FD-005",  price:150,   stock:0   },
      { pro_id: 6, productName: "Home Lamp",       pcategory: "home",        sku:"HM-006",  price:900,   stock:25  },
      { pro_id: 7, productName: "Beauty Cream",    pcategory: "beauty",      sku:"BT-007",  price:1200,  stock:60  },
      { pro_id: 8, productName: "iPad Mini",       pcategory: "electronics", sku:"APL-008", price:16000, stock:35  }
    ],
    comment: [
      { msg_id: 1, mem_id: 1, pro_id: 1, rating: 5, comment_text: "這支手機真的很好用！", comment_date:"2024-01-10 10:30:00"},
      { msg_id: 2, mem_id: 2, pro_id: 2, rating: 4, comment_text: "鞋子很舒服，會再回購", comment_date:"2024-01-11 14:20:00"},
      { msg_id: 3, mem_id: 3, pro_id: 3, rating: 3, comment_text: "品質普通，價格還可以", comment_date:"2024-01-12 09:15:00"},
      { msg_id: 4, mem_id: 4, pro_id: 1, rating: 5, comment_text: "拍照功能很強",         comment_date:"2024-01-13 18:45:00"},
      { msg_id: 5, mem_id: 5, pro_id: 4, rating: 2, comment_text: "咖啡偏苦，不太喜歡",   comment_date:"2024-01-14 08:00:00"},
      { msg_id: 6, mem_id: 1, pro_id: 8, rating: 4, comment_text: "平板很順，螢幕漂亮",   comment_date:"2024-01-15 09:10:00"},
      { msg_id: 7, mem_id: 2, pro_id: 4, rating: 5, comment_text: "這包豆子香氣很棒",     comment_date:"2024-01-16 11:00:00"},
      { msg_id: 8, mem_id: 3, pro_id: 5, rating: 1, comment_text: "拿鐵太甜了",           comment_date:"2024-01-17 13:00:00"},
      { msg_id: 9, mem_id: 4, pro_id: 7, rating: 4, comment_text: "保濕不錯",             comment_date:"2024-01-18 20:30:00"},
    ]
  };

  // -----------------------
  // 步驟（6章進階）
  // -----------------------
  const steps = [
    {
      id: "a1",
      title: "LIKE：模糊搜尋（關鍵字）",
      desc: "% 任意字串，_ 任意一個字元",
      tag: "LIKE",
      explain: [
        "LIKE 用來做「模糊比對」。",
        "`%` 代表任意長度字串；`_` 代表任意 1 個字元。",
        "常用：搜尋商品名稱、搜尋 Email、搜尋文字欄位。"
      ],
      sqlSamples: [
        {
          label: "找商品名稱包含 Coffee",
          sql: "SELECT pro_id, productName, price FROM product WHERE productName LIKE '%Coffee%';",
          run: () => tableFrom(selectCols(
            filter(data.product, r => like(r.productName, "%Coffee%")),
            ["pro_id","productName","price"]
          ))
        },
        {
          label: "找 email 以 mei 開頭",
          sql: "SELECT mem_id, cname, cemail FROM member WHERE cemail LIKE 'mei%';",
          run: () => tableFrom(selectCols(
            filter(data.member, r => like(String(r.cemail||""), "mei%")),
            ["mem_id","cname","cemail"]
          ))
        }
      ],
      practice: {
        prompt: "練習：找出 productName 包含 i 的電子產品（只顯示 productName, pcategory）。",
        answer: "SELECT productName, pcategory FROM product WHERE pcategory='electronics' AND productName LIKE '%i%';",
        run: () => tableFrom(selectCols(
          filter(data.product, r => r.pcategory==="electronics" && like(r.productName, "%i%")),
          ["productName","pcategory"]
        ))
      }
    },
    {
      id: "a2",
      title: "BETWEEN：範圍查詢",
      desc: "包含起訖值（>= AND <=）",
      tag: "BETWEEN",
      explain: [
        "BETWEEN 是「範圍」查詢，且包含起訖值。",
        "`price BETWEEN 500 AND 2000` 等同 `price >= 500 AND price <= 2000`。",
        "常用：價格區間、日期區間、分數區間。"
      ],
      sqlSamples: [
        {
          label: "找價格 500~2000 的商品",
          sql: "SELECT productName, price FROM product WHERE price BETWEEN 500 AND 2000;",
          run: () => tableFrom(selectCols(
            filter(data.product, r => r.price >= 500 && r.price <= 2000),
            ["productName","price"]
          ))
        },
        {
          label: "找評分 4~5 的評論",
          sql: "SELECT msg_id, rating, comment_text FROM comment WHERE rating BETWEEN 4 AND 5;",
          run: () => tableFrom(selectCols(
            filter(data.comment, r => r.rating >= 4 && r.rating <= 5),
            ["msg_id","rating","comment_text"]
          ))
        }
      ],
      practice: {
        prompt: "練習：找出價格 1000~20000 的商品，排序 price DESC。",
        answer: "SELECT * FROM product WHERE price BETWEEN 1000 AND 20000 ORDER BY price DESC;",
        run: () => tableFrom(sortBy(
          filter(data.product, r => r.price >= 1000 && r.price <= 20000),
          "price","DESC"
        ))
      }
    },
    {
      id: "a3",
      title: "IN：多個值的條件",
      desc: "比 OR 更乾淨",
      tag: "IN",
      explain: [
        "IN 可以一次指定多個可能值。",
        "`pcategory IN ('food','electronics')` 等同 `pcategory='food' OR pcategory='electronics'`。",
        "常用：分類篩選、狀態篩選、多個 id 查詢。"
      ],
      sqlSamples: [
        {
          label: "找 food 或 electronics 的商品",
          sql: "SELECT productName, pcategory FROM product WHERE pcategory IN ('food','electronics');",
          run: () => tableFrom(selectCols(
            filter(data.product, r => ["food","electronics"].includes(r.pcategory)),
            ["productName","pcategory"]
          ))
        },
        {
          label: "找 pro_id 在 (1,8) 的商品",
          sql: "SELECT pro_id, productName, price FROM product WHERE pro_id IN (1,8);",
          run: () => tableFrom(selectCols(
            filter(data.product, r => [1,8].includes(r.pro_id)),
            ["pro_id","productName","price"]
          ))
        }
      ],
      practice: {
        prompt: "練習：找出 rating 在 (1,2,5) 的評論（顯示 msg_id, rating）。",
        answer: "SELECT msg_id, rating FROM comment WHERE rating IN (1,2,5);",
        run: () => tableFrom(selectCols(
          filter(data.comment, r => [1,2,5].includes(r.rating)),
          ["msg_id","rating"]
        ))
      }
    },
    {
      id: "a4",
      title: "IS NULL：找空值",
      desc: "= NULL 會失敗，一定要用 IS NULL",
      tag: "IS NULL",
      explain: [
        "SQL 裡的 NULL 是「未知」，不能用 `= NULL` 比較。",
        "要用：`IS NULL` 或 `IS NOT NULL`。",
        "常用：找未填電話、找未填生日、找 description 為空。"
      ],
      sqlSamples: [
        {
          label: "找 phone 是 NULL 的會員",
          sql: "SELECT mem_id, cname, phone FROM member WHERE phone IS NULL;",
          run: () => tableFrom(selectCols(
            filter(data.member, r => r.phone === null),
            ["mem_id","cname","phone"]
          ))
        },
        {
          label: "找 birthday 不是 NULL 的會員",
          sql: "SELECT mem_id, cname, birthday FROM member WHERE birthday IS NOT NULL;",
          run: () => tableFrom(selectCols(
            filter(data.member, r => r.birthday !== null),
            ["mem_id","cname","birthday"]
          ))
        }
      ],
      practice: {
        prompt: "練習：找出 birthday 是 NULL 的會員（顯示 mem_id, cname）。",
        answer: "SELECT mem_id, cname FROM member WHERE birthday IS NULL;",
        run: () => tableFrom(selectCols(
          filter(data.member, r => r.birthday === null),
          ["mem_id","cname"]
        ))
      }
    },
    {
      id: "a5",
      title: "GROUP BY：分組統計（COUNT / AVG / SUM）",
      desc: "把資料分組後計算",
      tag: "GROUP BY",
      explain: [
        "GROUP BY 用來「分組後做統計」。",
        "最常搭配：COUNT(筆數)、AVG(平均)、SUM(總和)。",
        "例如：每個分類有幾個商品？每個商品平均幾分？"
      ],
      sqlSamples: [
        {
          label: "每個分類有幾個商品（COUNT）",
          sql: "SELECT pcategory, COUNT(*) AS cnt FROM product GROUP BY pcategory;",
          run: () => tableFrom(groupCount(data.product, "pcategory", "cnt"))
        },
        {
          label: "每個商品的平均評分（AVG）",
          sql: "SELECT pro_id, AVG(rating) AS avg_rating FROM comment GROUP BY pro_id;",
          run: () => tableFrom(groupAvg(data.comment, "pro_id", "rating", "avg_rating"))
        }
      ],
      practice: {
        prompt: "練習：計算每個 rating 出現幾次（顯示 rating, cnt）。",
        answer: "SELECT rating, COUNT(*) AS cnt FROM comment GROUP BY rating;",
        run: () => tableFrom(groupCount(data.comment, "rating", "cnt"))
      }
    },
    {
      id: "a6",
      title: "HAVING：分組後篩選（搭配 GROUP BY）",
      desc: "WHERE 是分組前，HAVING 是分組後",
      tag: "HAVING",
      explain: [
        "HAVING 用來「對分組後的結果再做篩選」。",
        "差別：WHERE 篩原始資料；HAVING 篩統計結果。",
        "例如：只顯示「評論數 >= 2 的商品」。"
      ],
      sqlSamples: [
        {
          label: "找評論數 >= 2 的商品（COUNT + HAVING）",
          sql: "SELECT pro_id, COUNT(*) AS cnt FROM comment GROUP BY pro_id HAVING cnt >= 2;",
          run: () => {
            const grouped = groupCount(data.comment, "pro_id", "cnt");
            return tableFrom(grouped.filter(r => r.cnt >= 2));
          }
        },
        {
          label: "找平均評分 >= 4 的商品（AVG + HAVING）",
          sql: "SELECT pro_id, AVG(rating) AS avg_rating FROM comment GROUP BY pro_id HAVING avg_rating >= 4;",
          run: () => {
            const grouped = groupAvg(data.comment, "pro_id", "rating", "avg_rating");
            return tableFrom(grouped.filter(r => r.avg_rating >= 4));
          }
        }
      ],
      practice: {
        prompt: "練習：找出「評論數 >= 2」的 mem_id（顯示 mem_id, cnt）。",
        answer: "SELECT mem_id, COUNT(*) AS cnt FROM comment GROUP BY mem_id HAVING cnt >= 2;",
        run: () => {
          const grouped = groupCount(data.comment, "mem_id", "cnt");
          return tableFrom(grouped.filter(r => r.cnt >= 2));
        }
      }
    }
  ];

  // -----------------------
  // State
  // -----------------------
  const state = { unlocked: 0, active: 0, done: new Set() };

  // DOM
  const stepList = document.getElementById("stepList");
  const contentArea = document.getElementById("contentArea");
  const contentTitle = document.getElementById("contentTitle");
  const contentBadge = document.getElementById("contentBadge");
  const progressBar = document.getElementById("progressBar");
  const statusPill = document.getElementById("statusPill");
  const btnNext = document.getElementById("btnNext");
  const btnReset = document.getElementById("btnReset");

  // -----------------------
  // Helpers: render table
  // -----------------------
  function escapeHtml(s){
    return String(s)
      .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
      .replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }
  function tableFrom(rows){
    if(!rows || rows.length === 0){
      return `<div class="note" style="margin:0">（查無資料）</div>`;
    }
    const cols = Object.keys(rows[0]);
    const thead = `<tr>${cols.map(c=>`<th>${escapeHtml(c)}</th>`).join("")}</tr>`;
    const tbody = rows.map(r => `<tr>${cols.map(c=>`<td>${escapeHtml(r[c])}</td>`).join("")}</tr>`).join("");
    return `<table><thead>${thead}</thead><tbody>${tbody}</tbody></table>`;
  }
  function selectCols(rows, cols){
    return rows.map(r => Object.fromEntries(cols.map(c => [c, r[c]])));
  }
  function filter(rows, fn){ return rows.filter(fn); }
  function sortBy(rows, key, dir="ASC"){
    const sign = dir==="DESC" ? -1 : 1;
    return [...rows].sort((a,b)=>{
      const av=a[key], bv=b[key];
      if(av===bv) return 0;
      return (av>bv?1:-1)*sign;
    });
  }

  // LIKE (simple, case-sensitive for demo)
  function like(value, pattern){
    // SQL % -> .* ; _ -> .
    const esc = pattern.replace(/[.+^${}()|[\]\\]/g, "\\$&")
                       .replaceAll("%", ".*")
                       .replaceAll("_", ".");
    const re = new RegExp("^" + esc + "$");
    return re.test(String(value));
  }

  // GROUP helpers
  function groupCount(rows, key, outName="cnt"){
    const map = new Map();
    for(const r of rows){
      const k = r[key];
      map.set(k, (map.get(k)||0)+1);
    }
    return [...map.entries()].map(([k,v]) => ({ [key]: k, [outName]: v }));
  }
  function groupAvg(rows, groupKey, valueKey, outName="avg"){
    const map = new Map();
    for(const r of rows){
      const k = r[groupKey];
      const v = Number(r[valueKey]);
      const cur = map.get(k) || { sum:0, n:0 };
      cur.sum += v; cur.n += 1;
      map.set(k, cur);
    }
    return [...map.entries()].map(([k, obj]) => ({
      [groupKey]: k,
      [outName]: Number((obj.sum/obj.n).toFixed(2))
    }));
  }

  // -----------------------
  // UI render
  // -----------------------
  function renderSteps(){
    stepList.innerHTML = "";
    steps.forEach((s, idx) => {
      const isUnlocked = idx <= state.unlocked;
      const isDone = state.done.has(s.id);
      const isActive = idx === state.active;

      const badge = isDone ? `<span class="badge ok">已完成</span>`
                   : isActive ? `<span class="badge now">進行中</span>`
                   : isUnlocked ? `<span class="badge">可學習</span>`
                   : `<span class="badge lock">未解鎖</span>`;

      const btn = document.createElement("button");
      btn.className = "stepbtn";
      btn.disabled = !isUnlocked;
      btn.innerHTML = `
        <div class="left">
          <div class="num">${idx+1}</div>
          <div class="label">
            <div class="title">${escapeHtml(s.title)}</div>
            <div class="desc">${escapeHtml(s.desc)}</div>
          </div>
        </div>
        ${badge}
      `;
      btn.onclick = () => { state.active = idx; renderAll(); };
      stepList.appendChild(btn);
    });
  }

  function sampleBoxHtml(stepId, idx, label, sql){
    const outId = `${stepId}_sample_${idx}_out`;
    return `
      <div class="box">
        <div class="bhd">
          <span>${escapeHtml(label)}</span>
          <span class="badge">範例</span>
        </div>
        <div class="bbd">
          <pre><code>${escapeHtml(sql)}</code></pre>
          <div class="actions">
            <button class="btn-accent" onclick="runSample('${stepId}', ${idx})">執行</button>
            <button onclick="copyText('${escapeJs(sql)}')">複製 SQL</button>
          </div>
          <div id="${outId}" style="margin-top:10px"></div>
        </div>
      </div>
    `;
  }

  function escapeJs(s){
    return String(s).replaceAll("\\","\\\\").replaceAll("'","\\'").replaceAll("\n","\\n");
  }

  function renderContent(){
    const s = steps[state.active];
    const isUnlocked = state.active <= state.unlocked;

    if(!isUnlocked){
      contentTitle.textContent = "尚未解鎖";
      contentBadge.textContent = "未解鎖";
      contentBadge.className = "badge lock";
      contentArea.innerHTML = `<div class="hint">請先完成前面的章節，才能解鎖本章。</div>`;
      return;
    }

    contentTitle.textContent = s.title;
    const isDone = state.done.has(s.id);
    contentBadge.textContent = isDone ? "已完成" : "進行中";
    contentBadge.className = isDone ? "badge ok" : "badge now";

    const explainHtml = s.explain.map(x => `<li>${escapeHtml(x)}</li>`).join("");
    const sampleBoxes = s.sqlSamples.map((it, i) => sampleBoxHtml(s.id, i, it.label, it.sql)).join("");

    const practiceId = `${s.id}_practice`;

    contentArea.innerHTML = `
      <div class="kicker">
        <span class="tag">${escapeHtml(s.tag)}</span>
        <span class="tag green">進階練習</span>
      </div>

      <p class="note">本章重點：</p>
      <ul class="note" style="margin-top:-6px">${explainHtml}</ul>

      <div class="grid2">${sampleBoxes}</div>

      <div class="box" style="margin-top:12px">
        <div class="bhd">
          <span>練習題</span>
          <span class="badge">${escapeHtml(s.tag)}</span>
        </div>
        <div class="bbd">
          <div class="note" style="margin:0 0 10px">${escapeHtml(s.practice.prompt)}</div>
          <textarea class="editor" id="${practiceId}" spellcheck="false"
            placeholder="在這裡輸入你的 SQL（按『顯示答案』可看參考）"></textarea>
          <div class="actions">
            <button class="btn-accent" onclick="runPractice('${s.id}')">執行練習</button>
            <button onclick="showAnswer('${s.id}')">顯示答案</button>
          </div>
          <div id="${practiceId}_out" style="margin-top:10px"></div>
          <div class="okhint" id="${practiceId}_ok" style="display:none;margin-top:10px">
            ✅ 練習正確！可以按「標記完成」解鎖下一章。
          </div>
        </div>
      </div>

      <div class="actions" style="margin-top:12px">
        <button class="btn-green" onclick="markDone()">標記完成</button>
        <button onclick="hintPhpMyAdmin()">提示：phpMyAdmin 怎麼跑？</button>
      </div>

      <div class="hint">
        小提醒：GROUP BY / HAVING 最常考：<br/>
        ✅ WHERE：分組前篩選原始資料<br/>
        ✅ HAVING：分組後篩選統計結果
      </div>
    `;
  }

  // -----------------------
  // Run sample/practice
  // -----------------------
  function runSample(stepId, idx){
    const s = steps.find(x => x.id === stepId);
    const out = document.getElementById(`${stepId}_sample_${idx}_out`);
    out.innerHTML = s.sqlSamples[idx].run();
  }

  function normalizeSql(sql){
    return sql.trim().replace(/\s+/g," ").replace(/;+\s*$/,";");
  }

  function runPractice(stepId){
    const s = steps.find(x => x.id === stepId);
    const ta = document.getElementById(`${stepId}_practice`);
    const out = document.getElementById(`${stepId}_practice_out`);
    const ok = document.getElementById(`${stepId}_practice_ok`);

    const userSql = normalizeSql(ta.value);
    const ansSql  = normalizeSql(s.practice.answer);

    out.innerHTML = s.practice.run();

    if(userSql.toLowerCase() === ansSql.toLowerCase()){
      ok.style.display = "block";
    } else {
      ok.style.display = "none";
      out.insertAdjacentHTML("beforebegin", `
        <div class="hint">
          你輸入的是：<code>${escapeHtml(userSql || "（空白）")}</code><br/>
          參考答案的重點：注意關鍵字順序、字串要加單引號、GROUP BY 後才能 HAVING。
        </div>
      `);
      setTimeout(()=>renderContent(), 60);
    }
  }

  function showAnswer(stepId){
    const s = steps.find(x => x.id === stepId);
    const ta = document.getElementById(`${stepId}_practice`);
    ta.value = s.practice.answer;
    ta.focus();
  }

  // -----------------------
  // Progress / unlock
  // -----------------------
  function markDone(){
    const s = steps[state.active];
    state.done.add(s.id);
    if(state.unlocked < steps.length - 1){
      state.unlocked = Math.max(state.unlocked, state.active + 1);
    }
    btnNext.disabled = state.active >= state.unlocked;
    renderAll();
    toast("已標記完成 ✅");
  }

  function updateProgress(){
    const doneCount = state.done.size;
    const total = steps.length;
    statusPill.textContent = `進度：${doneCount} / ${total}`;
    progressBar.style.width = `${Math.round((doneCount/total)*100)}%`;
    btnNext.disabled = !(state.active < state.unlocked);
  }

  function renderAll(){
    renderSteps();
    renderContent();
    updateProgress();
  }

  // -----------------------
  // Buttons
  // -----------------------
  document.getElementById("btnNext").addEventListener("click", ()=>{
    if(state.active < state.unlocked){
      state.active += 1;
      renderAll();
    }
  });

  document.getElementById("btnReset").addEventListener("click", ()=>{
    if(!confirm("確定要重置進度嗎？")) return;
    state.unlocked = 0;
    state.active = 0;
    state.done = new Set();
    renderAll();
    toast("已重置");
  });

  function hintPhpMyAdmin(){
    alert("phpMyAdmin：選 firstdb → 上方【SQL】→ 貼上語法 → 執行。");
  }

  function copyText(text){
    navigator.clipboard?.writeText(text).then(()=>toast("已複製到剪貼簿"))
      .catch(()=>alert("複製失敗，請手動選取複製。"));
  }

  function toast(msg){
    const div = document.createElement("div");
    div.textContent = msg;
    div.style.position = "fixed";
    div.style.left = "50%";
    div.style.bottom = "18px";
    div.style.transform = "translateX(-50%)";
    div.style.background = "rgba(0,0,0,.65)";
    div.style.border = "1px solid rgba(255,255,255,.12)";
    div.style.padding = "10px 12px";
    div.style.borderRadius = "12px";
    div.style.color = "#e5e7eb";
    div.style.zIndex = 9999;
    div.style.boxShadow = "0 10px 25px rgba(0,0,0,.35)";
    document.body.appendChild(div);
    setTimeout(()=>div.remove(), 1200);
  }

  // init
  renderAll();
</script>
</body>
</html>
