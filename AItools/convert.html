        async function extractFrames() {
            const duration = dom.videoElement.duration;
            dom.videoElement.muted = true;
            let lastFrameData = null;
            let frameCount = 0;
            for (let time = 0; time &lt; duration; time += PROCESS_INTERVAL_SECONDS) {
                try {
                    const percent = Math.round((time / duration) * 100);
                    dom.progressBar.style.width = `${percent}%`;
                    dom.progressText.textContent = translations[currentLang].progressTextAnalyzing
                        .replace(&#39;{percent}&#39;, percent)
                        .replace(&#39;{count}&#39;, frameCount);
                    await seekVideo(time);
                    dom.canvasElement.width = dom.videoElement.videoWidth;
                    dom.canvasElement.height = dom.videoElement.videoHeight;
                    ctx.drawImage(dom.videoElement, 0, 0, dom.canvasElement.width, dom.canvasElement.height);
                    const currentFrameData = getFrameImageData();
                    let isNewSlide = !lastFrameData || compareFrames(lastFrameData, currentFrameData) &lt; SIMILARITY_THRESHOLD;
                    if (isNewSlide) {
                        frameCount++;
                        const dataUrl = dom.canvasElement.toDataURL(&#39;image/jpeg&#39;, 0.9);
                        extractedSlidesDataUrls.push(dataUrl);
                        addSlideThumbnail(dataUrl, frameCount);
                        lastFrameData = currentFrameData;
                    }
                } catch (error) {
                    console.error(`Skipping problematic frame at time ${time.toFixed(2)}s:`, error);
                }
            }
            dom.processingSection.classList.add(&#39;hidden&#39;);
            dom.resultsSection.classList.remove(&#39;hidden&#39;);
            dom.resultsTitle.textContent = translations[currentLang].resultsTitle.replace(&#39;{count}&#39;, frameCount);
            updateSelectionState();
        }

        function seekVideo(time) {
            return new Promise((resolve, reject) =&gt; {
                const video = dom.videoElement;
                
                const onSeeked = () =&gt; {
                    video.removeEventListener(&#39;error&#39;, onError);
                    resolve();
                };
                
                const onError = () =&gt; {
                    video.removeEventListener(&#39;seeked&#39;, onSeeked);
                    reject(&#39;Video seeking failed&#39;);
                };

                video.addEventListener(&#39;seeked&#39;, onSeeked, { once: true });
                video.addEventListener(&#39;error&#39;, onError, { once: true });

                video.currentTime = time;
            });
        }
        
        function getFrameImageData() {
            const tempCanvas = document.createElement(&#39;canvas&#39;);
            tempCanvas.width = THUMBNAIL_WIDTH;
            tempCanvas.height = Math.round(THUMBNAIL_WIDTH * (dom.canvasElement.height / dom.canvasElement.width));
            const tempCtx = tempCanvas.getContext(&#39;2d&#39;);
            tempCtx.drawImage(dom.canvasElement, 0, 0, tempCanvas.width, tempCanvas.height);
            return tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height).data;
        }

        function compareFrames(data1, data2) {
            let diff = 0;
            for (let i = 0; i &lt; data1.length; i += 4) {
                diff += Math.abs(data1[i] - data2[i]) + Math.abs(data1[i + 1] - data2[i + 1]) + Math.abs(data1[i + 2] - data2[i + 2]);
            }
            return 1 - (diff / (data1.length * 0.75 * 255));
        }

        // --- File Generation ---
        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600).toString().padStart(2, &#39;0&#39;);
            const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, &#39;0&#39;);
            const s = Math.floor(seconds % 60).toString().padStart(2, &#39;0&#39;);
            const ms = (seconds % 1).toFixed(3).substring(2);
            return `${h}:${m}:${s}.${ms}`;
        }
        
        /**
         * Creates a VTT file content from a transcript, ensuring no cue exceeds 3 seconds
         * and splitting based on sentence structure.
         * @param {string} text The full transcript.
         * @param {number} duration The total duration of the video in seconds.
         * @returns {string} The formatted VTT content.
         */
        function createVTTFile(text, duration) {
            let vttContent = &quot;WEBVTT\n\n&quot;;
            if (!text || duration &lt;= 0) return vttContent;

            const cleanText = text.replace(/\s+/g, &#39; &#39;).trim();
            const totalChars = cleanText.length;
            if (totalChars === 0) return vttContent;

            const timePerChar = duration / totalChars;
            const MAX_DURATION = 3.0;

            // Split by various punctuation to get smaller, more logical chunks.
            const chunks = cleanText.match(/[^.!?。？！，,]+[.!?。？！，,]?/g) || [cleanText];

            let cues = [];
            let currentTime = 0;

            for (const chunk of chunks) {
                const trimmedChunk = chunk.trim();
                if (trimmedChunk.length === 0) continue;

                const estimatedDuration = trimmedChunk.length * timePerChar;

                if (estimatedDuration &lt;= MAX_DURATION) {
                    const endTime = currentTime + estimatedDuration;
                    cues.push({ start: currentTime, end: endTime, text: trimmedChunk });
                    currentTime = endTime;
                } else {
                    // This chunk is too long, so it must be split further.
                    const numSubCues = Math.ceil(estimatedDuration / MAX_DURATION);
                    const subCueBaseDuration = estimatedDuration / numSubCues;
                    const charsPerSubCue = Math.ceil(trimmedChunk.length / numSubCues);
                    
                    let currentPos = 0;
                    while (currentPos &lt; trimmedChunk.length) {
                        const subText = trimmedChunk.substring(currentPos, currentPos + charsPerSubCue).trim();
                        if (subText.length &gt; 0) {
                            // The duration of this sub-cue is proportional to its actual length
                            const subCueActualDuration = subText.length * timePerChar;
                            const endTime = currentTime + subCueActualDuration;
                            cues.push({ start: currentTime, end: endTime, text: subText });
                            currentTime = endTime;
                        }
                        currentPos += charsPerSubCue;
                    }
                }
            }
            
            // Final check to ensure the last cue does not exceed the video&#39;s total duration.
            if (cues.length &gt; 0) {
               cues[cues.length - 1].end = Math.min(cues[cues.length - 1].end, duration);
            }

            // Format all processed cues into the final VTT string.
            cues.forEach((cue, index) =&gt; {
                // Ensure start time is not greater than end time
                if (cue.start &gt;= cue.end) {
                    cue.end = cue.start + 0.1; // Give it a minimal duration
                }
                vttContent += `${index + 1}\n`;
                vttContent += `${formatTime(cue.start)} --&gt; ${formatTime(cue.end)}\n`;
                vttContent += `${cue.text}\n\n`;
            });

            return vttContent;
        }
